workflows:
  salem-prayer-android:
    name: Salem Prayer Android
    max_build_duration: 60
    instance_type: linux_x2

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/SalemPrayer/local.properties"

      - name: Build Android APK
        working_directory: SalemPrayer
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - SalemPrayer/app/build/outputs/apk/debug/app-debug.apk
